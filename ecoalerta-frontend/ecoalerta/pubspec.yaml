name: ecoalerta
description: "Proyecto EcoAlerta - Buzón Ambiental"
publish_to: 'none'
version: 2.3.4+6
environment:
  sdk: '>=3.10.0 <4.0.0'
# 2. Bloque de dependencias externas
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: ^1.2.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  image_picker: ^1.1.2

# 3. Bloque de herramientas de desarrollo
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 4. Configuración interna de Flutter (Fuentes, Iconos y Assets)
flutter:
  uses-material-design: true
  assets:
    - lib/assets/
